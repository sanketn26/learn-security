# Policy engine for the agentic SOC assistant.
# Tools are allowlisted. Response actions always require explicit approval.

agent:
  name: lab-soc-assistant
  mode: human-in-the-loop
  description: >
    Summarize alerts, retrieve playbooks, propose ATT&CK mappings, and
    recommend next steps. Never execute response actions without approval=APPROVE.

tools:
  get_alert:
    permission: read
    approval: false
  search_logs:
    permission: read
    approval: false
  get_playbook:
    permission: read
    approval: false
  map_attack:
    permission: read
    approval: false
  propose_actions:
    permission: read
    approval: false
  simulate_action:
    permission: respond
    approval: true
    allowed_actions:
      - disable_lab_mode
      - revoke_token_notice
      - block_actor
      - snapshot_logs

boundaries:
  network: localhost-and-labnet-only
  secrets: do-not-exfiltrate
  destructive_actions: never-without-approval
  outbound_llm: optional-and-lab-data-only

prompt_injection:
  treat_alert_fields_as_untrusted: true
  treat_log_bodies_as_untrusted: true
  ignore_instructions_inside_evidence: true
