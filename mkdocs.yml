site_name: Defensive Security Engineering
site_description: Visual-first, hands-on cybersecurity for software engineers
site_author: Defensive Security Engineering contributors
site_url: https://sanketn26.github.io/learn-security/
repo_url: https://github.com/sanketn26/learn-security
repo_name: sanketn26/learn-security
edit_uri: edit/main/docs/
copyright: Local Docker lab · authorized use only
docs_dir: docs
site_dir: site
# Capstone student work is local and gitignored; never build it into the site.
exclude_docs: |
  capstone/work/*
  !capstone/work/README.md
not_in_nav: |
  capstone/work/README.md
plugins:
  - search
  # Templates moved under capstone/templates/; keep old published URLs alive.
  - redirects:
      redirect_maps:
        capstone/threat-model.md: capstone/templates/threat-model.md
        capstone/attack-coverage.md: capstone/templates/attack-coverage.md
        capstone/incident-report.md: capstone/templates/incident-report.md
        capstone/containment-runbook.md: capstone/templates/containment-runbook.md
        capstone/purple-report.md: capstone/templates/purple-report.md
        capstone/architecture-review.md: capstone/templates/architecture-review.md
        capstone/security-decision-record.md: capstone/templates/security-decision-record.md
  - social:
      cards_layout_options:
        background_color: "#1a1b26"
        color: "#ffffff"
theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Start Here:
      - Welcome: index.md
      - Onboarding: onboarding.md
      - How defenders think: how-defenders-think.md
      - Setup and first lab: setup.md
      - Learning paths: learning-paths.md
      - Safety and ethics: ethics.md
  - Course Map:
      - Full course guide: course.md
      - Exercise index: exercises.md
      - Modules overview: modules/README.md
  - Modules:
      - Part I — Understand the System:
          - 1. Security foundations: modules/01-security-foundations.md
          - 2. Network and OS: modules/02-network-and-os.md
          - 3. Identity and access: modules/03-identity-and-access.md
          - 4. Application and API: modules/04-application-and-api.md
          - 5. Cloud, containers, Kubernetes: modules/05-cloud-containers-k8s.md
          - 6. Cryptography: modules/06-cryptography.md
      - Part II — See and Defend the System:
          - 7. Monitoring and logs: modules/07-monitoring-and-logs.md
          - 8. MITRE ATT&CK: modules/08-mitre-attack.md
          - 9. Red, blue, and purple: modules/09-red-blue-purple.md
          - 10. Security operations center: modules/10-soc.md
          - 11. Detection and incident response: modules/11-detection-and-ir.md
      - Part III — Design What Comes Next:
          - 12. Agentic SOC: modules/12-agentic-soc.md
          - 13. Security architecture: modules/13-security-architecture.md
          - 14. Future directions: modules/14-future.md
      - Part IV — Extended Lenses:
          - 15. ML/AI system security: modules/15-ml-ai-security.md
          - 16. Availability and denial of service: modules/16-availability-and-dos.md
          - 17. Phishing, social engineering, insider risk: modules/17-human-factor-attacks.md
  - Capstones:
      - Defensive platform:
          - Start here: capstone/README.md
          - How to work through: capstone/howto.md
          - Templates:
              - capstone/templates/README.md
              - Threat model: capstone/templates/threat-model.md
              - ATT&CK coverage: capstone/templates/attack-coverage.md
              - Incident report: capstone/templates/incident-report.md
              - Containment runbook: capstone/templates/containment-runbook.md
              - Purple-team report: capstone/templates/purple-report.md
              - Architecture review: capstone/templates/architecture-review.md
              - Security decision record: capstone/templates/security-decision-record.md
              - Replay fixtures: capstone/templates/replay-fixture.md
              - Agent run: capstone/templates/agent-run.md
          - Worked example (Helix):
              - capstone/reference/README.md
              - Threat model: capstone/reference/threat-model-example.md
              - ATT&CK coverage: capstone/reference/attack-coverage-example.md
              - Incident report: capstone/reference/incident-report-example.md
              - Containment runbook: capstone/reference/containment-runbook-example.md
              - Purple-team report: capstone/reference/purple-report-example.md
              - Architecture review: capstone/reference/architecture-review-example.md
              - Decision record: capstone/reference/security-decision-record-example.md
      - Python vulnerability scanner: capstone/vulnerability-scanner.md
  - Reference:
      - Lab guide: lab-guide.md
      - Glossary: glossary.md
      - Assessment: assessment.md
      - References: references.md
      - Condensed plan: condensed-plan.md
      - Follow-up projects: follow-up-projects.md
extra_javascript:
  # Vendored so diagrams render when the course is served offline.
  - assets/javascripts/mermaid-11.16.1.min.js
